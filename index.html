<style>

nav{display:flex;gap:4px;max-width:800px;margin:0 auto;padding:6px}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;color:var(--ink);border:2px solid transparent;border-radius:12px;padding:6px 2px;min-height:58px}

main:focus,[tabindex="-1"]:focus{outline:none}
h1{font-size:1.4em;line-height:1.3;margin:.4em 0 .5em}

.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}

input,select,textarea{font:inherit;font-size:1em;width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:52px}

<body>
<header><nav id="nav" aria-label="Main"></nav></header>
<div id="banner" aria-live="polite"></div>
<main id="app" tabindex="-1"><p style="padding:20px">Loading…</p></main>
<noscript><p style="padding:20px">This app needs JavaScript turned on.</p></noscript>
<script>
'use strict';
const VERSION = '1.0.0';
const DB_NAME = 'cwb-test-maker', DB_STORE = 'kv', DB_KEY = 'state', LS_KEY = 'cwb-test-maker-state';
const DAY = 86400000;
const LETTERS = 'ABCDEF';
const SIZES = [18, 20, 23, 26];
const MODES = {learn: '📖 Knowledge', exam: '📝 Exam', redo: '🔁 Redo'};

const DEMO = [
  {chapter: 'Demo', q: 'What does CJP stand for?',
   options: ['Complete joint penetration', 'Critical joint pass', 'Cut joint preparation', 'Common joint profile'], answer: 0,
   why: 'CJP means complete joint penetration. The weld goes all the way through the thickness of the joint.',
   wrongWhy: ['', 'A “pass” is one layer of weld, not a type of joint.', 'Joint prep is the bevel you cut before welding, not the weld itself.', 'This isn’t a welding term.'],
   hook: 'Feel a nail you hammered right through a board. You can feel the tip poke out the back. All the way through = complete.'},
  {chapter: 'Demo', q: 'What does UT use to find flaws inside a weld?',
   options: ['Magnetic particles', 'Sound waves', 'Coloured dye', 'Just your eyes'], answer: 1,
   why: 'UT (ultrasonic testing) sends high-pitched sound into the steel and reads the echoes that bounce back off flaws.',
   wrongWhy: ['Magnetic particles are MT (magnetic particle testing).', '', 'Coloured dye is PT (penetrant testing).', 'Looking with your eyes is VT (visual testing). It can’t see inside the weld.'],
   hook: 'Shout in an empty arena and feel the echo hit you a second later. UT listens for the echo off a flaw.'},
  {chapter: 'Demo', q: 'MT (magnetic particle testing) works on which steel?',
   options: ['Any metal at all', 'Magnetic steel, like carbon steel', 'Aluminum', 'Austenitic stainless steel (like 304)'], answer: 1,
   why: 'MT only works on metal that can be magnetized (ferromagnetic), like carbon steel.',
   wrongWhy: ['It won’t work on metals that aren’t magnetic.', '', 'Aluminum isn’t magnetic, so MT won’t work.', 'Austenitic stainless isn’t magnetic, so MT won’t work.'],
   hook: 'Feel a fridge magnet snap onto the fridge door. If a magnet won’t snap onto the steel, MT won’t work either.'}
];

let S = null;              // saved state
let storage = 'idb';       // idb | local | memory
let db = null;
let saveChain = Promise.resolve();
let saveFailed = false;
let deferredInstall = null;
let persisted = null;

const UI = {
  tab: 'study', qsub: null, editId: null, editDraft: null, openCh: null, find: '',
  msg: null, armed: null, armTimer: null, resumeAsk: false, confirmFinish: false, showRight: false,
  learnCh: '*', learnN: '10', examN: '40', examAll: true, examChs: [],
  makeCh: '', makeN: '20', pasteDraft: '', restoreDraft: '', showPrompt: false, showRestorePaste: false,
  askedPersist: false
};

/* ---------- small helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const nowISO = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const range = n => Array.from({length: n}, (_, i) => i);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function clampInt(v, lo, hi, d) { v = parseInt(v, 10); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; }
function cleanStr(x) { return (typeof x === 'string' || typeof x === 'number') ? String(x).replace(/\s+/g, ' ').trim() : ''; }
function normKey(t) { const s = cleanStr(t).toLowerCase(); return s.replace(/[^a-z0-9]+/g, ' ').trim() || s; }
function validISO(s) { if (typeof s !== 'string') return null; const d = new Date(s); return isNaN(d) ? null : d.toISOString(); }
function fmtDate(iso) { const d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'}) + ', ' + d.toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit'}); }
function pct(r, n) { return n ? Math.round(100 * r / n) : 0; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function qById(id) { return S.bank.find(q => q.id === id); }
function chapters() { return [...new Set(S.bank.map(q => q.chapter))].sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'})); }
function chCount(c) { return S.bank.filter(q => q.chapter === c).length; }
function isStandalone() { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }

/* ---------- questions ---------- */
function validateQ(x) {
  if (!x || typeof x !== 'object' || Array.isArray(x)) return {ok: false, why: 'it isn’t a question'};
  const q = cleanStr(x.q ?? x.question);
  if (!q) return {ok: false, why: 'the question text is missing'};
  let opts = x.options ?? x.choices;
  if (!Array.isArray(opts)) return {ok: false, why: 'the list of answers is missing'};
  opts = opts.map(cleanStr);
  if (opts.length < 2) return {ok: false, why: 'it needs at least 2 answers'};
  if (opts.length > 6) return {ok: false, why: 'it has more than 6 answers'};
  if (opts.some(o => !o)) return {ok: false, why: 'one of the answers is blank'};
  if (new Set(opts.map(o => o.toLowerCase())).size !== opts.length) return {ok: false, why: 'two answers are the same'};
  let a = x.answer;
  if (typeof a === 'string') {
    const t = a.trim();
    if (/^\d+$/.test(t)) a = Number(t);
    else if (/^[a-f]$/i.test(t)) a = t.toUpperCase().charCodeAt(0) - 65;
    else a = opts.findIndex(o => o.toLowerCase() === t.toLowerCase());
  }
  if (!Number.isInteger(a) || a < 0 || a >= opts.length) return {ok: false, why: 'the right answer is missing or doesn’t match one of the answers'};
  const ww0 = Array.isArray(x.wrongWhy) ? x.wrongWhy.map(cleanStr) : [];
  const wrongWhy = opts.map((_, i) => i === a ? '' : (ww0[i] || ''));
  return {ok: true, q: {chapter: cleanStr(x.chapter) || 'General', q, options: opts, answer: a, why: cleanStr(x.why), wrongWhy, hook: cleanStr(x.hook)}};
}
function makeQ(v, keep) {
  const s = keep && keep.st && typeof keep.st === 'object' ? keep.st : {};
  return Object.assign({id: (keep && typeof keep.id === 'string' && keep.id) || uid()}, v, {
    st: {right: clampInt(s.right, 0, 1e6, 0), wrong: clampInt(s.wrong, 0, 1e6, 0), streak: clampInt(s.streak, 0, 1, 0), redo: !!s.redo},
    added: (keep && validISO(keep.added)) || nowISO(),
    demo: !!(keep && keep.demo)
  });
}
function addQuestions(state, list, keep) {
  const keys = new Set(state.bank.map(q => normKey(q.q)));
  const ids = new Set(state.bank.map(q => q.id));
  const res = {added: 0, dup: 0, bad: []};
  list.forEach((x, i) => {
    const v = validateQ(x);
    if (!v.ok) { res.bad.push({n: i + 1, why: v.why}); return; }
    const k = normKey(v.q.q);
    if (keys.has(k)) { res.dup++; return; }
    const q = makeQ(v.q, keep ? x : null);
    if (ids.has(q.id)) q.id = uid();
    keys.add(k); ids.add(q.id);
    state.bank.push(q); res.added++;
  });
  return res;
}
function recordAnswer(q, ok) {
  if (ok) {
    q.st.right++;
    if (q.st.redo) { q.st.streak++; if (q.st.streak >= 2) { q.st.redo = false; q.st.streak = 0; } }
  } else { q.st.wrong++; q.st.redo = true; q.st.streak = 0; }
}
function parseQuestions(text) {
  const t = String(text || '').trim();
  if (!t) return {error: 'The box is empty. Paste the questions from Claude first.'};
  const unfenced = t.replace(/```[a-zA-Z]*\s*/g, '').replace(/```/g, '').trim();
  const tries = [unfenced];
  const s1 = unfenced.search(/[\[{]/), e1 = Math.max(unfenced.lastIndexOf(']'), unfenced.lastIndexOf('}'));
  if (s1 >= 0 && e1 > s1) tries.push(unfenced.slice(s1, e1 + 1));
  tries.push(tries[tries.length - 1].replace(/[“”„‟″]/g, '"'));
  for (const x of tries) {
    let v;
    try { v = JSON.parse(x); } catch (e) { continue; }
    if (v && typeof v === 'object' && !Array.isArray(v)) v = Array.isArray(v.questions) ? v.questions : Array.isArray(v.bank) ? v.bank : [v];
    if (!Array.isArray(v)) continue;
    if (!v.length) return {error: 'There were no questions in that paste.'};
    return {list: v};
  }
  return {error: 'That paste didn’t work. Copy everything Claude wrote (from the first [ to the last ]) and try again.'};
}

/* ---------- state ---------- */
function freshState(withDemo) {
  const st = {v: 1, created: nowISO(), savedAt: null, bank: [], hist: [], settings: {pass: 70, size: 1}, lastBackup: null, snoozeUntil: null, session: null};
  if (withDemo) addQuestions(st, DEMO.map(d => Object.assign({demo: true}, d)), true);
  return st;
}
function cleanHist(h) {
  if (!h || typeof h !== 'object') return null;
  const n = clampInt(h.n, 0, 1e5, 0);
  if (!n) return null;
  return {id: typeof h.id === 'string' && h.id ? h.id : uid(), date: validISO(h.date) || nowISO(),
    mode: MODES[h.mode] ? h.mode : 'learn', label: cleanStr(h.label).slice(0, 120) || 'Test',
    right: clampInt(h.right, 0, n, 0), n, pass: h.pass === true ? true : h.pass === false ? false : null,
    passMark: clampInt(h.passMark, 1, 100, 70)};
}
function cleanItem(it) {
  if (!it || typeof it.qid !== 'string') return null;
  return {qid: it.qid, order: Array.isArray(it.order) ? it.order : [], pick: Number.isInteger(it.pick) ? it.pick : null};
}
function cleanSession(s) {
  if (!s || typeof s !== 'object' || !MODES[s.mode]) return null;
  const out = {id: typeof s.id === 'string' ? s.id : uid(), mode: s.mode, label: cleanStr(s.label) || 'Test',
    created: validISO(s.created) || nowISO(), finished: !!s.finished, note: cleanStr(s.note), passMark: clampInt(s.passMark, 1, 100, 70)};
  if (s.mode === 'redo') {
    out.ids = Array.isArray(s.ids) ? s.ids.filter(x => typeof x === 'string') : [];
    out.queue = Array.isArray(s.queue) ? s.queue.filter(x => typeof x === 'string') : [];
    out.cur = cleanItem(s.cur);
    out.answered = clampInt(s.answered, 0, 1e6, 0);
    out.right = clampInt(s.right, 0, out.answered, 0);
    if (!out.ids.length) return null;
  } else {
    out.items = Array.isArray(s.items) ? s.items.map(cleanItem).filter(Boolean) : [];
    if (!out.items.length) return null;
    out.i = clampInt(s.i, 0, out.items.length - 1, 0);
    out.result = s.result && typeof s.result === 'object' ? {right: clampInt(s.result.right, 0, 1e5, 0), n: clampInt(s.result.n, 0, 1e5, 0)} : null;
    if (out.finished && !out.result) return null;
  }
  return out;
}
function normalizeState(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.bank)) return freshState(true);
  const st = freshState(false);
  st.created = validISO(raw.created) || st.created;
  st.savedAt = validISO(raw.savedAt);
  st.lastBackup = validISO(raw.lastBackup);
  st.snoozeUntil = validISO(raw.snoozeUntil);
  addQuestions(st, raw.bank, true);
  st.hist = Array.isArray(raw.hist) ? raw.hist.map(cleanHist).filter(Boolean) : [];
  if (raw.settings && typeof raw.settings === 'object') {
    st.settings.pass = clampInt(raw.settings.pass, 1, 100, 70);
    st.settings.size = clampInt(raw.settings.size, 0, SIZES.length - 1, 1);
  }
  st.session = cleanSession(raw.session);
  return st;
}

/* ---------- storage ---------- */
function withTimeout(p, ms) { return new Promise((res, rej) => { const t = setTimeout(() => rej(new Error('timeout')), ms); p.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); }); }); }
function idbOpen() {
  return withTimeout(new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  }), 4000);
}
function idbGet() {
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const rq = tx.objectStore(DB_STORE).get(DB_KEY);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
}
function idbPut(v) {
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(v, DB_KEY);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('aborted'));
  });
}
async function loadState() {
  let a = null, b = null;
  try { db = await idbOpen(); a = await idbGet(); storage = 'idb'; }
  catch (e) { console.warn('IndexedDB not available', e); storage = 'local'; }
  try { const t = localStorage.getItem(LS_KEY); if (t) b = JSON.parse(t); } catch (e) { b = null; }
  if (storage === 'local') {
    try { localStorage.setItem(LS_KEY + '-test', '1'); localStorage.removeItem(LS_KEY + '-test'); } catch (e) { storage = 'memory'; }
  }
  const newer = (x, y) => !x ? y : !y ? x : ((Date.parse(y.savedAt) || 0) > (Date.parse(x.savedAt) || 0) ? y : x);
  return normalizeState(newer(a, b));
}
async function writeState(st) {
  st.savedAt = nowISO();
  if (storage === 'idb') {
    try { await idbPut(st); saveFailed = false; return; }

/* ---------- sessions ---------- */
function newItem(q) { return {qid: q.id, order: shuffle(range(q.options.length)), pick: null}; }

  const okOrder = Array.isArray(it.order) && it.order.length === n && new Set(it.order).size === n && it.order.every(x => Number.isInteger(x) && x >= 0 && x < n);
  if (!okOrder) { it.order = shuffle(range(n)); it.pick = null; }

function fixSession() {

  if (s.mode === 'redo') {
    s.ids = s.ids.filter(id => qById(id));
    s.queue = s.queue.filter(id => qById(id));
    if (s.cur) s.cur = fixItem(s.cur);
    if (!s.finished && !s.cur) {
      const nid = s.queue.shift();
      if (nid) s.cur = newItem(qById(nid));
      else if (s.answered > 0) { s.finished = true; s.cur = null; }
      else S.session = null;
    }
    if (S.session && !s.ids.length) S.session = null;
  } else {
    s.items = s.items.map(fixItem).filter(Boolean);
    if (!s.items.length) S.session = null;

  if (S.session !== s || JSON.stringify(s) !== before) save();
}
function guardSession() {

function beginSession(sess) {

function startLearn(ch, n) {

  const want = n === 'all' ? pool.length : clampInt(n, 1, 10000, 10);

    note: count < want ? `You asked for ${want}, but there ${pool.length === 1 ? 'is' : 'are'} only ${plural(pool.length, 'question')}, so you’ll get ${count}.` : '',
    items: pool.slice(0, count).map(newItem), i: 0, result: null, passMark: S.settings.pass});
}

  const pool = shuffle(S.bank.filter(q => !chs || chs.includes(q.chapter)));
  if (!pool.length) { flash('study', 'bad', 'There are no questions for that exam yet.'); return; }
  const want = clampInt(UI.examN, 25, 50, 40);
  const count = Math.min(want, pool.length);
  beginSession({id: uid(), mode: 'exam', label: !chs ? 'All chapters' : chs.length === 1 ? chs[0] : plural(chs.length, 'chapter'), created: nowISO(), finished: false,
    note: count < want ? `You asked for ${want} questions, but you only have ${pool.length}, so this exam has ${count}.` : '',
    items: pool.slice(0, count).map(newItem), i: 0, result: null, passMark: S.settings.pass});

function curItem() { const s = S.session; if (!s) return null; return s.mode === 'redo' ? s.cur : s.items[s.i]; }

function applySize() { document.documentElement.style.setProperty('--fs', SIZES[S.settings.size] + 'px'); }

async function copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
function readFileText(f) {
  if (f.text) return f.text();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(r.error); r.readAsText(f); });
}
function importBackup(text) {
  let data = null;
  try { data = JSON.parse(String(text || '').trim()); } catch (e) { const r = parseQuestions(text); data = r.error ? null : r.list; }
  let list = null, hist = [], settings = null;
  if (Array.isArray(data)) list = data;
  else if (data && typeof data === 'object' && Array.isArray(data.bank)) { list = data.bank; hist = Array.isArray(data.hist) ? data.hist : []; settings = data.settings; }
  if (!list) { flash('settings', 'bad', 'That isn’t a Test Maker backup. Nothing was changed.'); return false; }
  const res = addQuestions(S, list, true);
  const ids = new Set(S.hist.map(x => x.id));
  let hAdded = 0;
  hist.map(cleanHist).filter(Boolean).forEach(x => { if (!ids.has(x.id)) { S.hist.push(x); ids.add(x.id); hAdded++; } });
  S.hist.sort((a, b) => b.date.localeCompare(a.date));
  if (settings && typeof settings === 'object') {
    S.settings.pass = clampInt(settings.pass, 1, 100, S.settings.pass);
    S.settings.size = clampInt(settings.size, 0, SIZES.length - 1, S.settings.size);
    applySize();
  }
  save();
  let msg = `✅ Restored ${plural(res.added, 'question')} and ${plural(hAdded, 'score')}.`;
  if (res.dup) msg += `\n⏭️ ${plural(res.dup, 'question was', 'questions were')} already here.`;
  if (res.bad.length) msg += `\n⚠️ ${plural(res.bad.length, 'question')} couldn’t be read.`;
  flash('settings', res.added || hAdded || res.dup ? 'ok' : 'bad', msg);
  return true;
}
function doPaste() {
  const box = $('#pasteBox');
  const text = box ? box.value : UI.pasteDraft;
  UI.pasteDraft = text;
  const r = parseQuestions(text);
  if (r.error) { flash('paste', 'bad', r.error); return; }
  const res = addQuestions(S, r.list, false);
  const lines = [];
  if (res.added) lines.push(`✅ Added ${plural(res.added, 'question')}.`);
  if (res.dup) lines.push(`⏭️ Skipped ${res.dup} already in your bank.`);
  if (res.bad.length) {
    lines.push(`⚠️ ${plural(res.bad.length, 'question')} couldn’t be added:`);
    res.bad.slice(0, 10).forEach(b => lines.push(`• Question ${b.n}: ${b.why}.`));
    if (res.bad.length > 10) lines.push(`• …and ${res.bad.length - 10} more.`);
  }
  if (!lines.length) lines.push('There were no questions in that paste.');
  if (res.added) { UI.pasteDraft = ''; save(); }
  flash('paste', res.added ? 'ok' : 'bad', lines.join('\n'));
}
function saveEdit() {

  if (!v.ok) { flash('edit', 'bad', `Can’t save yet: ${v.why}.`); return; }
  const k = normKey(v.q.q);
  if (S.bank.some(x => x.id !== UI.editId && normKey(x.q) === k)) { flash('edit', 'bad', 'Can’t save yet: you already have a question with the same words.'); return; }
  const isNew = !UI.editId;
  if (isNew) S.bank.push(makeQ(v.q));

}

  next: () => next(),
  back: () => back(),
  finishNow: () => { const s = S.session; if (!s) return; if (s.mode === 'exam') finishAsk(); else finishTest(); },
  finishTest: () => finishTest(),
  gotoUnanswered: () => { const s = S.session; if (!s || !s.items) return; const i = s.items.findIndex(x => x.pick === null); if (i >= 0) s.i = i; UI.confirmFinish = false; save(); render(true); },
  pause: () => { UI.resumeAsk = true; render(true); },
  resume: () => { UI.resumeAsk = false; UI.msg = null; render(true); },
  discard: () => { S.session = null; UI.resumeAsk = false; save(); flash('study', 'ok', '🗑 Test thrown away.'); },
  done: () => { S.session = null; save(); go('study'); },
  toggleRight: () => { UI.showRight = !UI.showRight; render(); },
  redoAgain: () => { S.session = null; save(); startRedo(); },
  stopRedo: () => finishRedo(),
  passDown: () => { S.settings.pass = Math.max(5, Math.round((S.settings.pass - 5) / 5) * 5); save(); render(); },
  passUp: () => { S.settings.pass = Math.min(100, Math.round((S.settings.pass + 5) / 5) * 5); save(); render(); },
  size: b => { S.settings.size = clampInt(b.dataset.size, 0, SIZES.length - 1, 1); applySize(); save(); render(); },
  exportFile: () => exportFile(),
  shareBackup: () => shareBackup(),
  copyBackup: async () => {
    const ok = await copyText(backupText());
    if (ok) { markBackedUp(); flash('settings', 'ok', '✅ Backup copied. Paste it somewhere safe, like an email to yourself or a note.'); }
    else flash('settings', 'bad', 'Copy didn’t work here. Try “Save backup file” instead.');
  },
  restorePaste: () => { const box = $('#restoreBox'); const t = box ? box.value : UI.restoreDraft; if (!cleanStr(t)) { flash('settings', 'bad', 'Paste your backup text in the box first.'); return; } if (importBackup(t)) UI.restoreDraft = ''; render(); },
  delDemo: () => { const n = S.bank.length; S.bank = S.bank.filter(q => !q.demo); save(); flash('settings', 'ok', `🗑 Removed ${plural(n - S.bank.length, 'demo question')}.`); },
  wipe: () => { S = freshState(false); UI.resumeAsk = false; UI.openCh = null; UI.find = ''; applySize(); save(); flash('settings', 'ok', '🗑 Everything was deleted.'); },
  clearHist: () => { S.hist = []; save(); flash('scores', 'ok', '🗑 Score history cleared.'); },
  goBackup: () => { go('settings'); const el = $('#backup'); if (el && el.scrollIntoView) el.scrollIntoView({block: 'start'}); },
  snooze: () => { S.snoozeUntil = new Date(Date.now() + DAY).toISOString(); save(); renderBanner(); },
  install: () => { const p = deferredInstall; if (!p) return; deferredInstall = null; p.prompt(); (p.userChoice || Promise.resolve()).then(() => render(), () => render()); }
};
function disarm() {
  clearTimeout(UI.armTimer);
  if (UI.armed) {
    const prev = document.querySelector(`[data-confirm="${CSS.escape(UI.armed)}"]`);
    if (prev && prev.dataset.orig !== undefined) { prev.innerHTML = prev.dataset.orig; prev.classList.remove('armed'); delete prev.dataset.orig; }
  }
  UI.armed = null;
}
function arm(b) {
  UI.armed = b.dataset.confirm;
  b.dataset.orig = b.innerHTML;
  b.textContent = b.dataset.confirmText || 'Tap again to confirm';
  b.classList.add('armed');
  UI.armTimer = setTimeout(disarm, 5000);
}
function showError(err) {
  console.error(err);
  const b = $('#banner');
  if (!b) return;
  const d = document.createElement('div');
  d.className = 'banner bad';
  d.textContent = '⚠️ Something went wrong. Your saved work is safe. If it keeps happening, close and reopen the app.';
  b.appendChild(d);
  setTimeout(() => d.remove(), 8000);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || !S) return;
  if (b.dataset.confirm) {
    if (UI.armed !== b.dataset.confirm) { disarm(); arm(b); return; }
    disarm();
  } else if (UI.armed) disarm();
  ensurePersist();
  const fn = ACTIONS[b.dataset.act];
  if (!fn) return;
  try { const r = fn(b, e); if (r && r.catch) r.catch(showError); } catch (err) { showError(err); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!S || !t.dataset) return;
  if (t.dataset.ui) {
    UI[t.dataset.ui] = t.value;
    if (t.dataset.ui === 'makeN') { const p = $('#promptBox'); if (p) p.value = buildPrompt(); }
    return;
  }
  if (t.dataset.uiCheck === 'examAll') { UI.examAll = t.checked; render(); return; }
  if (t.dataset.exch !== undefined) { const c = t.dataset.exch; UI.examChs = t.checked ? [...new Set(UI.examChs.concat(c))] : UI.examChs.filter(x => x !== c); return; }
  if (t.id === 'importFile' && t.files && t.files[0]) {
    const f = t.files[0];
    t.value = '';
    if (f.size > 25 * 1024 * 1024) { flash('settings', 'bad', 'That file is too big to be a backup.'); return; }
    readFileText(f).then(importBackup, () => flash('settings', 'bad', 'Couldn’t read that file.')).catch(showError);
  }
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset && t.dataset.uiLive;
  if (!k || !S) return;
  UI[k] = t.value;
  if (k === 'find') { const l = $('#qlist'); if (l) l.innerHTML = qListHtml(); }
  if (k === 'makeCh') { const p = $('#promptBox'); if (p) p.value = buildPrompt(); }
});
document.addEventListener('toggle', e => {
  if (e.target.id === 'restoreDetails') UI.showRestorePaste = e.target.open;
  if (e.target.id === 'promptDetails') UI.showPrompt = e.target.open;
}, true);
document.addEventListener('keydown', e => {
  if (!S || e.altKey || e.ctrlKey || e.metaKey || !inQuiz()) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = e.key.toLowerCase();
  let pos = k.length === 1 ? '123456'.indexOf(k) : -1;
  if (pos < 0 && k.length === 1) pos = 'abcdef'.indexOf(k);
  if (pos >= 0) { const btn = document.querySelectorAll('.opt')[pos]; if (btn && !btn.disabled) { e.preventDefault(); btn.click(); } return; }
  if (tag === 'button' && (k === 'enter' || k === ' ')) return;
  if (k === 'enter' || k === 'arrowright') { const nb = $('[data-act="next"]'); if (nb && !nb.disabled) { e.preventDefault(); nb.click(); } }
  else if (k === 'arrowleft') { const bb = $('[data-act="back"]'); if (bb && !bb.disabled) { e.preventDefault(); bb.click(); } }
});
window.addEventListener('online', () => { if (S) { renderBanner(); if (UI.qsub === 'make') render(); } });
window.addEventListener('offline', () => { if (S) { renderBanner(); if (UI.qsub === 'make') render(); } });
window.addEventListener('error', e => showError(e.error || e.message));
window.addEventListener('unhandledrejection', e => showError(e.reason));
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (S && UI.tab === 'settings') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; if (S && UI.tab === 'settings') render(); });

/* ---------- start ---------- */
async function init() {
  try { S = await loadState(); }
  catch (e) { console.error(e); S = freshState(true); storage = 'memory'; }
  applySize();
  if (S.session && !S.session.finished) UI.resumeAsk = true;
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { persisted = p; }).catch(() => {});
  render();
  if (!S.savedAt) save();
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('./sw.js').catch(e => console.warn('Offline mode not available', e));
}
init();
</script>
</body>
